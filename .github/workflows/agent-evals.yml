name: Agentic Harness Evals

on:
  push:
    paths:
      - ".agents/**"
      - "AGENTS.md"
      - "tools/**"
      - ".github/workflows/agent-evals.yml"
  pull_request:
    paths:
      - ".agents/**"
      - "AGENTS.md"
      - "tools/**"
      - ".github/workflows/agent-evals.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  harness-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest mcp

      - name: Run Tier 0 Static Harness Linter
        run: ./tools/run-evals.sh --tier 0 --suite lint

      - name: Verify All Evaluation Graders & Replay Fixtures
        run: ./tools/run-evals.sh --tier all --suite lint --verify-graders

      - name: Run Evaluation Unit Tests
        run: pytest tools/evals/tests/test_harness_lint.py tools/evals/tests/test_trace_grader.py
