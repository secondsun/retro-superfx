name: sfx-studio CI

on:
  push:
    paths:
      - "sfx-studio/**"
      - ".github/workflows/sfx-studio-ci.yml"
  pull_request:
    paths:
      - "sfx-studio/**"
      - ".github/workflows/sfx-studio-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build, Format & Test sfx-studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: "26"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x sfx-studio/mvnw

      - name: Verify Code Style (Spotless / ktlint)
        run: ./sfx-studio/mvnw -f sfx-studio/pom.xml --batch-mode --no-transfer-progress spotless:check

      - name: Run Unit Tests
        run: ./sfx-studio/mvnw -f sfx-studio/pom.xml --batch-mode --no-transfer-progress test
